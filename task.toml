description = "Repair a storage engine's crash-recovery build so it rebuilds the committed key-value table from a write-ahead journal: honour the written contract on torn writes, commit durability, fuzzy checkpoints, idempotent redo and delete semantics, on the crash cases the shipped samples never show."
