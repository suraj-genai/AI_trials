difficulty_explanation = "This task uses a hand-authored C implementation of a constrained embedded-memory allocator, similar to firmware used by embedded engineers maintaining fixed-size controller memory. The allocator must translate logical allocation requests into physical column mappings while maintaining fragmentation, sharing, resizing, and serialized metadata invariants. The defect is exposed only through an interaction between allocation history and metadata serialization, so the task requires debugging behavior across multiple layers rather than fixing an isolated statement."

solution_explanation = "The defect is an incorrect metadata record-length calculation in serialization: records with at least three physical segments and a non-1024-byte-aligned logical size have their body length reduced by four bytes even though all segments are still serialized. The repair removes that erroneous reduction so the encoded length matches the serialized metadata body and record boundaries remain valid."

verification_explanation = "The verifier independently executes the allocator implementation through a deterministic multi-phase request sequence and checks logical mappings, sharing relationships, free-space accounting, metadata validity, and allocator invariants after the relevant phases." 

