<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Grove Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1518676590629-3c552b2dd2ad?ixlib=rb-4.0.3&q=80&fm=jpg&crop=entropy&cs=tinysrgb&w=1920') center/cover fixed;
    }
  </style>
</head>
<body class="h-full flex flex-col">

  <div class="flex-1 flex max-w-screen-xl mx-auto w-full">
    <!-- Left Sidebar -->
    <div class="w-1/4 p-4 overflow-y-auto bg-white bg-opacity-95">
      <h2 class="text-2xl font-bold text-amber-900 mb-3">Journal Dates</h2>
      
      <!-- Calendar -->
      <div class="bg-white p-4 rounded-lg shadow-md border border-amber-200">
        <div class="grid grid-cols-7 gap-1 text-center text-sm font-medium text-amber-800 mb-2">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>
        <div id="calendar" class="grid grid-cols-7 gap-1 text-center text-sm">
          <div class="text-gray-400">27</div><div class="text-gray-400">28</div><div class="text-gray-400">29</div><div class="text-gray-400">30</div><div class="text-gray-400">31</div><div>1</div><div>2</div>
          <div>3</div><div>4</div><div>5</div><div class="bg-amber-700 text-white rounded-full w-8 h-8 leading-8 mx-auto">6</div><div>7</div><div>8</div><div>9</div>
          <div class="bg-amber-700 text-white rounded-full w-8 h-8 leading-8 mx-auto">10</div><div>11</div><div>12</div><div>13</div><div>14</div><div>15</div><div>16</div>
          <div>17</div><div class="bg-amber-600 text-white rounded-full w-8 h-8 leading-8 mx-auto font-bold">18</div><div>19</div><div>20</div><div>21</div><div>22</div>
        </div>
      </div>

      <!-- Today's Entry button -->
      <button id="today" class="mt-4 w-full bg-amber-100 hover:bg-amber-200 text-amber-900 px-4 py-3 rounded-lg font-semibold border-2 border-amber-600">
        Today's Entry →
      </button>

      <div class="mt-6 text-center">
        <img src="https://images.unsplash.com/photo-1518676590629-3c552b2dd2ad?ixlib=rb-4.0.3&q=80&fm=jpg&crop=entropy&cs=tinysrgb&w=300" alt="Leather journal" class="rounded-lg shadow mx-auto w-32">
        <p class="text-xs text-amber-700 mt-2">Your private thoughts,<br>forever remembered.</p>
      </div>
    </div>

    <!-- Right Chat Area -->
    <div class="w-3/4 flex flex-col">
      <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-6">
        <!-- Messages will be loaded here -->
      </div>

      <!-- Input bar -->
      <div class="p-4 bg-white bg-opacity-95 border-t-2 border-amber-700">
        <div class="flex gap-2 max-w-4xl mx-auto">
          <textarea id="input" rows="1" class="flex-1 resize-none rounded-lg border border-amber-600 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-700" placeholder="Write in your journal... Press Enter to send"></textarea>
          <button id="send" class="bg-amber-700 hover:bg-amber-800 text-white px-6 py-2 rounded-lg font-semibold">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const todayBtn = document.getElementById('today');
    
    let currentDate = new Date().toISOString().split('T')[0]; // YYYY-MM-DD format

    // Load messages for current date on page load
    window.addEventListener('DOMContentLoaded', () => {
      addMessage("Welcome to your journal. What's on your mind today?", false);  //loadMessages(currentDate);
    });

    // Add message to UI
    function addMessage(text, isUser) {
      const div = document.createElement('div');
      div.className = isUser ? 'flex justify-end' : 'flex justify-start';
      const bubble = document.createElement('div');
      bubble.className = isUser 
        ? 'bg-amber-700 text-white px-4 py-3 rounded-l-lg rounded-tr-lg max-w-lg shadow'
        : 'bg-white text-amber-900 px-4 py-3 rounded-r-lg rounded-tl-lg max-w-lg shadow border';
      bubble.textContent = text;
      div.appendChild(bubble);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    // Add streaming message (for AI responses)
    function addStreamingMessage() {
      const div = document.createElement('div');
      div.className = 'flex justify-start';
      const bubble = document.createElement('div');
      bubble.className = 'bg-white text-amber-900 px-4 py-3 rounded-r-lg rounded-tl-lg max-w-lg shadow border';
      bubble.id = 'streaming-message';
      bubble.textContent = '';
      div.appendChild(bubble);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    // Load messages from Flask backend
    async function loadMessages(date) {
      try {
        const response = await fetch(`/api/messages?date=${date}`);
        const data = await response.json();
        
        messages.innerHTML = ''; // Clear existing messages
        
        if (data.messages && data.messages.length > 0) {
          data.messages.forEach(msg => {
            addMessage(msg.content, msg.role === 'user');
          });
        } else {
          addMessage("Welcome to your journal. What's on your mind today?", false);
        }
      } catch (error) {
        console.error('Error loading messages:', error);
        addMessage("Error loading messages. Please try again.", false);
      }
    }

    // Send message to Flask backend with streaming
    async function sendMessage(text) {
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            message: text,
            date: currentDate
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const streamingBubble = addStreamingMessage();
        let buffer = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value,{ stream: true });
          const lines = buffer.split('\n');

          // NEW: Keep last incomplete line in buffer
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const content = line.slice(6);
              // NEW: Handle done signal
              if (content === '[DONE]') {
                break;
              }
              if (content != '') {
                streamingBubble.textContent += content;
                messages.scrollTop = messages.scrollHeight;
              }
            }
          }
        }
        streamingBubble.id = ''; // Remove streaming ID after completion
      } catch (error) {
        console.error('Error sending message:', error);
        addMessage("Error sending message. Please try again.", false);
      }
    }

    // Send button click handler
    send.addEventListener('click', () => {
      if (input.value.trim() ) {
        const userMessage = input.value.trim();
        addMessage(userMessage, true);
        sendMessage(userMessage);
        input.value = '';
      }
    });

    // Today button click handler
    todayBtn.addEventListener('click', () => {
      currentDate = new Date().toISOString().split('T')[0];
     // loadMessages(currentDate);
    });

    // Enter key handler
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send.click();
      }
    });

    // Calendar date click handler (for future implementation)
    document.getElementById('calendar').addEventListener('click', (e) => {
      if (e.target.textContent && !e.target.classList.contains('text-gray-400')) {
        const day = e.target.textContent;
        // TODO: Calculate proper date from clicked day
        // For now, just reload today's messages
        loadMessages(currentDate);
      }
    });
  </script>
</body>
</html>
