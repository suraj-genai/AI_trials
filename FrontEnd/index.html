<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Memory Grove - AI Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full overflow-hidden">

  <!-- Header (Fixed) -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-gradient-to-r from-amber-800 to-amber-600 text-white shadow-lg">
    <div class="px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl md:text-2xl font-bold">🌳 Memory Grove</h1>
      <div class="flex items-center gap-2">
        <button id="export-btn" class="px-3 py-1.5 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg text-sm transition" title="Export backup">
          📥 <span class="hidden sm:inline">Export</span>
        </button>
        <button id="import-btn" class="px-3 py-1.5 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg text-sm transition" title="Import backup">
          📤 <span class="hidden sm:inline">Import</span>
        </button>
        <button id="settings-btn" class="px-3 py-1.5 bg-white bg-opacity-20 hover:bg-opacity-30 rounded-lg text-sm transition" title="Settings">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="flex h-full pt-14">

    <!-- Left Sidebar (Fixed) -->
    <aside class="hidden md:flex md:w-80 flex-col bg-white border-r border-amber-200 overflow-hidden">

      <!-- Calendar Section (Scrollable) -->
      <div class="flex-1 overflow-y-auto p-4">
        <h2 class="text-xl font-bold text-amber-900 mb-4">Journal Dates</h2>

        <!-- Calendar -->
        <div class="bg-amber-50 p-4 rounded-lg shadow-md border border-amber-200 mb-4">
          <div class="flex justify-between items-center mb-3">
            <button id="prev-month" class="text-amber-700 hover:text-amber-900 font-bold text-xl"><</button>
            <h3 id="current-month" class="text-lg font-semibold text-amber-900">November 2025</h3>
            <button id="next-month" class="text-amber-700 hover:text-amber-900 font-bold text-xl">></button>
          </div>

          <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-amber-800 mb-2">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
          </div>

          <div id="calendar" class="grid grid-cols-7 gap-1 text-center text-sm">
            <!-- Calendar will be generated by JavaScript -->
          </div>
        </div>

        <!-- Action Buttons -->
        <button id="today-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white px-4 py-3 rounded-lg font-semibold mb-2 transition">
          📅 Today's Entry
        </button>

        <button id="make-entry-btn" class="w-full bg-amber-100 hover:bg-amber-200 text-amber-900 px-4 py-3 rounded-lg font-semibold border-2 border-amber-600 mb-2 transition" disabled>
          ✏️ Make Entry
        </button>

        <button id="delete-entry-btn" class="w-full bg-red-100 hover:bg-red-200 text-red-900 px-4 py-3 rounded-lg font-semibold border-2 border-red-600 transition" disabled>
          🗑️ Delete Entry
        </button>

        <div class="mt-6 text-center">
          <p class="text-xs text-amber-700 italic">Your private thoughts,<br>forever remembered.</p>
        </div>
      </div>
    </aside>

    <!-- Mobile Calendar Toggle -->
    <button id="mobile-calendar-toggle" class="md:hidden fixed bottom-20 left-4 z-40 bg-amber-600 text-white p-3 rounded-full shadow-lg">
      📅
    </button>

    <!-- Right Chat Area -->
    <main class="flex-1 flex flex-col overflow-hidden">

      <!-- Messages Area (Scrollable) -->
      <div id="messages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 bg-gradient-to-b from-amber-50 to-white">
        <!-- Welcome message -->
        <div class="text-center py-8 text-amber-700">
          <h2 class="text-2xl font-bold mb-2">Welcome to Memory Grove 🌳</h2>
          <p class="text-sm">Your AI-powered journaling companion</p>
        </div>
      </div>

      <!-- Input Area (Fixed) -->
      <footer class="border-t-2 border-amber-700 bg-white p-3 md:p-4">
        <div class="max-w-4xl mx-auto">
          <div class="flex gap-2 items-end">
            <textarea
              id="input"
              rows="1"
              class="flex-1 resize-none rounded-lg border-2 border-amber-600 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-amber-700 max-h-32 overflow-y-auto"
              placeholder="Write in your journal..."></textarea>

            <div class="flex flex-col gap-2">
              <button id="send" class="bg-amber-700 hover:bg-amber-800 text-white px-6 py-3 rounded-lg font-semibold transition whitespace-nowrap">
                🔍 Analyze
              </button>
              <button id="finish-entry-btn" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-semibold transition text-sm whitespace-nowrap">
                ✅ Finish
              </button>
            </div>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- Settings Modal (Reserved for future use) -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>⚙️ Settings</h2>
      <div class="text-left mb-4">
        <p class="text-sm text-gray-600">Settings will be available in a future update.</p>
      </div>
      <div class="flex gap-2 justify-center mt-6">
        <button id="close-settings-btn" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- Mobile Calendar Modal -->
  <div id="mobile-calendar-modal" class="modal hidden md:hidden">
    <div class="modal-content max-w-sm">
      <h2>📅 Calendar</h2>

      <div class="bg-amber-50 p-4 rounded-lg mb-4">
        <div class="flex justify-between items-center mb-3">
          <button id="mobile-prev-month" class="text-amber-700 hover:text-amber-900 font-bold text-xl"><</button>
          <h3 id="mobile-current-month" class="text-lg font-semibold text-amber-900">November 2025</h3>
          <button id="mobile-next-month" class="text-amber-700 hover:text-amber-900 font-bold text-xl">></button>
        </div>

        <div class="grid grid-cols-7 gap-1 text-center text-xs font-semibold text-amber-800 mb-2">
          <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
        </div>

        <div id="mobile-calendar" class="grid grid-cols-7 gap-1 text-center text-sm">
          <!-- Calendar will be generated by JavaScript -->
        </div>
      </div>

      <button id="mobile-today-btn" class="w-full bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg font-semibold mb-2">
        Today's Entry
      </button>

      <button id="mobile-make-entry-btn" class="w-full bg-amber-100 hover:bg-amber-200 text-amber-900 px-4 py-2 rounded-lg font-semibold border-2 border-amber-600 mb-2" disabled>
        Make Entry
      </button>

      <button id="mobile-delete-entry-btn" class="w-full bg-red-100 hover:bg-red-200 text-red-900 px-4 py-2 rounded-lg font-semibold border-2 border-red-600 mb-4" disabled>
        Delete Entry
      </button>

      <button id="close-mobile-calendar" class="btn-secondary w-full">Close</button>
    </div>
  </div>

  <!-- Load JavaScript files -->
  <script src="js/database.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
