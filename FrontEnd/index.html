<!DOCTYPE html>
<html lang="en">
<head>
  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal AI Assistant</title>
  <!-- 
    To view this app on your mobile:
    1. Place this HTML inside your Flask app's templates or static folder.
    2. Run Flask with: flask run --host=0.0.0.0 --port=7860
    3. On your mobile (connected to the same Wi-Fi), open: http://<your-PC-IP>:7860
  -->
  <style>
    body {
      background: #f5f5f5;
      font-family: 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    #app {
      width: 95%;
      max-width: 500px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: #2e5cff;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.2rem;
      font-weight: 600;
    }
    #chat-log {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .message {
      margin-bottom: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .user {
      text-align: right;
      color: #2e5cff;
      font-weight: 500;
    }
    .assistant {
      text-align: left;
      color: #333;
    }
    footer {
      display: flex;
      border-top: 1px solid #eee;
      padding: 0.5rem;
      background: #fafafa;
    }
    #user-input {
      flex: 1;
      border: none;
      padding: 0.75rem;
      font-size: 1rem;
      border-radius: 8px;
      outline: none;
      background: #f0f0f0;
      margin-right: 0.5rem;
    }
    button {
      background: #2e5cff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    button:hover {
      background: #2348cc;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>Personal AI Assistant</header>
    <div id="chat-log"></div>
    <footer>
      <input id="user-input" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
    </footer>
  </div>

  <script>
    const chatLog = document.getElementById('chat-log');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    const converter = new showdown.Converter();

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      appendMessage('user', message);
      userInput.value = '';

      appendMessage('assistant', 'Thinking...');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        const data = await res.json();
        chatLog.lastChild.innerHTML = converter.makeHtml(data.reply.replace(/\n/g, '<br>'));
      } catch (err) {
        chatLog.lastChild.innerHTML = 'Error: Could not connect to server';
      }

      chatLog.scrollTop = chatLog.scrollHeight;
    }



    function appendMessage(sender, text) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      if (sender === 'assistant') {
        const html = converter.makeHtml(text.replace(/\n/g, '<br>'));
        div.innerHTML = html;
      } else {
        div.textContent = text;
      }
      chatLog.appendChild(div);
    }
  </script>
</body>
</html>
